<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TripTrekker – Travel Planner Bot</title>

  <!-- Google Font for a modern look -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(to right, #e0f7fa, #e1bee7);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .intro {
      text-align: center;
      margin-bottom: 20px;
    }

    .intro h1 {
      font-size: 2rem;
      color: #2c3e50;
      margin-bottom: 10px;
    }

    .intro p {
      font-size: 1rem;
      color: #555;
      max-width: 400px;
      margin: 0 auto;
    }

    /* Optional: reposition the Dialogflow widget */
    df-messenger {
      --df-messenger-bot-message: #ffffff;
      --df-messenger-user-message: #dcf8c6;
      --df-messenger-chat-background-color: #fafafa;
      --df-messenger-font-color: #000000;
      --df-messenger-button-titlebar-color: #6a1b9a;
      --df-messenger-send-icon: #6a1b9a;
      position: fixed;
      bottom: 20px;
      right: 20px;
    }
  </style>
</head>
<body>

  <div class="intro">
    <h1>TripTrekker Travel Bot</h1>
    <p>Hi! I'm your travel planner. Ask me about destinations like Goa, Jaipur, or Shimla – or build your own custom itinerary!</p>
  </div>

  <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>
<df-messenger
  intent="WELCOME"
  chat-title="TravelBot"
  agent-id="4624033b-d009-436f-8fc6-bacc1579f012"
  language-code="en"
></df-messenger>
</body>
</html>
