<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TripTrekker - Welcome</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
  <style>
    /* Background gradient with subtle slow animation */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(270deg, #00c6ff, #0072ff, #00a6ff, #005fcc);
      background-size: 800% 800%;
      animation: backgroundShift 20s ease infinite;
    }
    @keyframes backgroundShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Glassmorphic container */
    .container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 50px 60px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      max-width: 400px;
      width: 90%;
      color: #fff;
      animation: fadeIn 1.2s ease forwards;
      opacity: 0;
      transform: translateY(20px);
    }
    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Animated gradient text for logo */
    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 64px;
      background: linear-gradient(270deg, #00e0ff, #0072ff, #00c6ff, #005fcc);
      background-size: 600% 600%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textGradientShift 8s ease infinite;
      margin-bottom: 15px;
      text-shadow: 2px 2px 8px rgba(0, 0, 80, 0.6);
    }
    @keyframes textGradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    p {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 40px;
      text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.3);
    }

    /* Button styles with scale and shadow on hover */
    .button-group {
      display: flex;
      justify-content: center;
      gap: 25px;
    }

    .btn {
      display: inline-block;
      padding: 14px 36px;
      border-radius: 35px;
      font-weight: 700;
      font-size: 17px;
      text-decoration: none;
      color: white;
      transition: all 0.35s ease;
      box-shadow: 0 6px 15px rgba(0, 114, 255, 0.4);
      user-select: none;
    }

    .signup {
      background: linear-gradient(45deg, #0072ff, #00c6ff);
      box-shadow: 0 6px 18px rgba(0, 194, 255, 0.6);
    }

    .signup:hover {
      background: linear-gradient(45deg, #00c6ff, #0072ff);
      box-shadow: 0 10px 25px rgba(0, 194, 255, 0.8);
      transform: scale(1.12);
    }

    .login {
      background: linear-gradient(45deg, #00c6ff, #005fcc);
      box-shadow: 0 6px 18px rgba(0, 92, 204, 0.6);
    }

    .login:hover {
      background: linear-gradient(45deg, #005fcc, #00c6ff);
      box-shadow: 0 10px 25px rgba(0, 92, 204, 0.8);
      transform: scale(1.12);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>TripTrekker</h1>
    <p>Your adventure starts here</p>
    <div class="button-group">
      <a href="signup.html" class="btn signup">Sign Up</a>
      <a href="login1.html" class="btn login">Login</a>
    </div>
  </div>
</body>
</html>
