<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg, #89f7fe, #66a6ff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #333;
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    h1 {
      margin-bottom: 20px;
    }
    a {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background: #6e7bff;
      color: white;
      border-radius: 12px;
      text-decoration: none;
      transition: background 0.3s ease;
    }
    a:hover {
      background: #5a6bcf;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Welcome to the Review App</h1>
    <p>This is a placeholder index page.</p>
    <a href="/">Go to Home Page</a><br><br>
    <a href="/review">Go to Review Page</a>
  </div>
</body>
</html>
