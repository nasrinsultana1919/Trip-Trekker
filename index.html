<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travel Options</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 3rem;
      text-shadow: 0 0 10px #fff, 0 0 20px #6e7bff;
      animation: pulse 2.5s infinite ease-in-out;
    }
    .subheading {
  font-size: 1.1rem;
  color: #f0f0f0;
  margin-bottom: 2.5rem;
  font-weight: 500;
  text-shadow: 0 0 5px rgba(255,255,255,0.2);
}

    .container {
      display: grid;
      gap: 2rem;
      text-align: center;
    }

    a.option {
      display: block;
      padding: 1.2rem 2rem;
      font-size: 1.2rem;
      font-weight: bold;
      background: linear-gradient(45deg, #ff6b81, #f65aa7);
      color: white;
      text-decoration: none;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(255, 105, 180, 0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    a.option:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(255, 105, 180, 0.6);
      background: linear-gradient(45deg, #f65aa7, #ff6b81);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .top-nav {
      width: 100%;
      text-align: center;
      position: absolute;
      top: 20px;
      left: 0;
      z-index: 10;
    }

    .back-btn {
      display: inline-block;
      padding: 12px 25px;
      background-color: #6e7bff;
      color: white;
      text-decoration: none;
      border-radius: 15px;
      font-size: 1rem;
      font-weight: bold;
      box-shadow: 0 0 12px rgba(110, 123, 255, 0.3);
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background-color: #5463d0;
      box-shadow: 0 0 20px rgba(84, 99, 208, 0.5);
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      .container {
        gap: 1.5rem;
      }

      a.option {
        font-size: 1rem;
        padding: 1rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="top-nav">
    <a href="home.html" class="back-btn">← Home</a>
  </div>

  <div class="container">
  <h1>Your Travel. Your Way. 😍</h1>
  <p class="subheading">Choose from our exclusive travel services and plan your perfect escape ✈🏨🚌</p>
  <a href="flights.html" class="option">✈ Flights</a>
  <a href="hotels.html" class="option">🏨 Hotels</a>
  <a href="holiday-packages.html" class="option">🎁 Holiday Packages</a>
  <a href="train.html" class="option">🚆 Train / Bus</a>
</div>
</body>
</html>
