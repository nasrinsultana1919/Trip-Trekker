<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stylish Review Page</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #6e7bff, #b5c6ff);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }

    .container {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 600px;
      box-shadow:
        0 4px 8px rgba(110, 123, 255, 0.25),
        0 10px 20px rgba(110, 123, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(110, 123, 255, 0.3);
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      color: #2c3e50;
      margin-bottom: 30px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 20px;
      border: 1.8px solid #ccc;
      border-radius: 14px;
      font-size: 1rem;
      background: white;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: #6e7bff;
      outline: none;
      box-shadow: 0 0 12px rgba(110, 123, 255, 0.6);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .star-rating {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
    }

    .star-rating input {
      display: none;
    }

    .star-rating label {
      font-size: 2.6rem;
      color: #ddd;
      cursor: pointer;
      transition: color 0.3s ease, transform 0.15s ease;
      user-select: none;
      margin: 0 6px;
      filter: drop-shadow(0 0 1px rgba(0,0,0,0.1));
    }

    .star-rating label:hover,
    .star-rating label:hover ~ label {
      color: #ffbe0b;
      transform: scale(1.3);
    }

    .star-rating input:checked ~ label {
      color: #ffbe0b;
      transform: scale(1.3);
    }

    button {
      width: 100%;
      padding: 16px;
      background: #6e7bff;
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 1.2rem;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 6px 15px rgba(110, 123, 255, 0.4);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    button:hover {
      background: #5a6bcf;
      box-shadow: 0 10px 25px rgba(90, 107, 207, 0.6);
    }

    .reviews {
      margin-top: 40px;
    }

    .review {
      background: white;
      border-radius: 20px;
      padding: 22px 28px;
      margin-bottom: 20px;
      box-shadow:
        0 8px 16px rgba(110, 123, 255, 0.18),
        0 4px 8px rgba(0, 0, 0, 0.06);
      border: 1.5px solid #d7dbff;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .review:hover {
      transform: translateY(-7px);
      box-shadow:
        0 20px 30px rgba(110, 123, 255, 0.35),
        0 8px 12px rgba(0, 0, 0, 0.1);
    }

    .review .name {
      font-weight: 700;
      color: #3a3f5c;
      font-size: 1.2rem;
      margin-bottom: 8px;
      letter-spacing: 0.04em;
    }

    .review .stars {
      color: #ffbe0b;
      font-size: 1.6rem;
      margin-bottom: 12px;
      user-select: none;
      filter: drop-shadow(0 0 1px rgba(0,0,0,0.1));
    }

    .review p {
      font-size: 1rem;
      color: #4a4e6a;
      line-height: 1.5;
    }

    .no-reviews {
      text-align: center;
      font-style: italic;
      color: #7f8c8d;
      font-size: 1.1rem;
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px 25px;
      }

      .star-rating label {
        font-size: 2.2rem;
        margin: 0 4px;
      }

      button {
        font-size: 1.1rem;
        padding: 14px;
      }
    }
  .top-nav {
  width: 100%;
  text-align: center;
  padding: 20px 0;
  position: absolute;
  top: 0;
  left: 0;
  z-index: 10;
}

.back-btn {
  display: inline-block;
  padding: 10px 20px;
  background-color: #6e7bff;
  color: white;
  text-decoration: none;
  border-radius: 12px;
  font-weight: 600;
  font-size: 1rem;
  transition: background-color 0.3s ease, box-shadow 0.3s ease;
  box-shadow: 0 4px 12px rgba(110, 123, 255, 0.3);
}

.back-btn:hover {
  background-color: #5a6bcf;
  box-shadow: 0 6px 18px rgba(90, 107, 207, 0.45);
}
  </style>
</head>
<body>

  <div class="container">
    <h1>Share Your Thoughts</h1>

    <form id="reviewForm">
      <input type="text" id="name" placeholder="Your Name" required />
      <textarea id="review" placeholder="Write your review..." required></textarea>

      <div class="star-rating">
        <input type="radio" id="star5" name="rating" value="5" required />
        <label for="star5">&#9733;</label>
        <input type="radio" id="star4" name="rating" value="4" />
        <label for="star4">&#9733;</label>
        <input type="radio" id="star3" name="rating" value="3" />
        <label for="star3">&#9733;</label>
        <input type="radio" id="star2" name="rating" value="2" />
        <label for="star2">&#9733;</label>
        <input type="radio" id="star1" name="rating" value="1" />
        <label for="star1">&#9733;</label>
      </div>

      <button type="submit">Submit Review</button>
    </form>

    <div class="reviews" id="reviewsSection">
      <p class="no-reviews">Be the first to leave a review!</p>
    </div>
  </div>
  <script>
    const form = document.getElementById('reviewForm');
    const reviewsSection = document.getElementById('reviewsSection');
    const noReviewsText = document.querySelector('.no-reviews');

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      const name = document.getElementById('name').value.trim();
      const reviewText = document.getElementById('review').value.trim();
      const rating = form.rating.value;

      if (!name || !reviewText || !rating) {
        alert('Please fill in all fields and select a rating.');
        return;
      }

      const reviewDiv = document.createElement('div');
      reviewDiv.classList.add('review');

      const nameEl = document.createElement('div');
      nameEl.classList.add('name');
      nameEl.textContent = name;

      const starsEl = document.createElement('div');
      starsEl.classList.add('stars');
      starsEl.textContent = '★'.repeat(rating) + '☆'.repeat(5 - rating);

      const reviewEl = document.createElement('p');
      reviewEl.textContent = reviewText;

      reviewDiv.appendChild(nameEl);
      reviewDiv.appendChild(starsEl);
      reviewDiv.appendChild(reviewEl);

      if (noReviewsText) noReviewsText.remove();

      reviewsSection.insertBefore(reviewDiv, reviewsSection.firstChild);

      form.reset();
    });
  </script>
  <footer class="top-nav">
  <a href="/" class="back-btn">Home</a>
</footer>
</body>
</html>
