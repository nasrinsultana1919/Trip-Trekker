  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(120deg, #d1f4f9, #e0f7fa);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 95%;
      max-width: 500px;
      height: 90vh;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #0288d1;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 1.4em;
      font-weight: bold;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      background: #f1f5f9;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .message {
      margin: 10px 0;
      padding: 14px 18px;
      max-width: 80%;
      border-radius: 16px;
      position: relative;
      animation: fadeIn 0.4s ease;
      line-height: 1.5;
      white-space: pre-line;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bot {
      background: #e1f5fe;
      color: #01579b;
      align-self: flex-start;
      border-top-left-radius: 0;
    }

    .user {
      background: #0288d1;
      color: white;
      align-self: flex-end;
      border-top-right-radius: 0;
    }

    .city-image {
      width: 100%;
      margin-top: 10px;
      border-radius: 12px;
      max-height: 180px;
      object-fit: cover;
    }

    .chat-input {
      display: flex;
      padding: 12px;
      border-top: 1px solid #ddd;
      background: #ffffff;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ccc;
      border-radius: 24px;
      font-size: 1em;
      outline: none;
      transition: 0.3s;
    }

    input[type="text"]:focus {
      border-color: #0288d1;
    }

    button {
      margin-left: 10px;
      padding: 12px 20px;
      background: #0288d1;
      color: white;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      background: #0277bd;
    }
  </style>
</head>

<div class="chat-container">
  <div class="chat-header">Travel Planner Bot</div>
  <div class="chat-messages" id="chatMessages">
    <div class="message bot">
      Hello! Ask me: <br>"Trip to Goa", "Trip to Udaipur", etc.<br><br>
      Or add plans:<br>Add city: Name<br>Day 1: ...<br>Day 2: ...
    </div>
  </div>
  <form id="chatForm" class="chat-input" autocomplete="off">
    <input type="text" id="userInput" placeholder="Type your message..." required />
    <button type="submit">Send</button>
  </form>
</div>

  const chatMessages = document.getElementById('chatMessages');
  const chatForm = document.getElementById('chatForm');
  const userInput = document.getElementById('userInput');

  function addMessage(text, sender, city = null) {
    const msg = document.createElement('div');
    msg.classList.add('message', sender);
    msg.textContent = text;

    if (sender === 'bot' && city && cityImages[city]) {
      const img = document.createElement('img');
      img.src = cityImages[city];
      img.alt = city + " image";
      img.className = "city-image";
      msg.appendChild(img);
    }

    chatMessages.appendChild(msg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function getTravelPlan(cityName) {
    const city = cityName.toLowerCase();
    return plans[city]
      ? { plan: plans[city].join("\n"), city }
      : { plan: "Sorry, I don't have a plan for that city yet.", city: null };
  }

  function parseMultipleCityPlans(text) {
    const entries = text.split(/add city:/i).slice(1);
    const parsed = [];

    for (let entry of entries) {
      const lines = entry.trim().split('\n').map(l => l.trim());
      const cityName = lines[0].toLowerCase();
      const itinerary = [];

      for (let i = 1; i <= 5; i++) {
        const dayLine = lines[i];
        if (!dayLine || !dayLine.toLowerCase().startsWith(`day ${i}:`)) return null;
        itinerary.push(dayLine);
      }

      parsed.push({ city: cityName, itinerary });
    }

    return parsed;
  }

  chatForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = userInput.value.trim();
    if (!text) return;

    addMessage(text, 'user');

    if (text.toLowerCase().includes('add city:')) {
      const cities = parseMultipleCityPlans(text);
      if (cities) {
        cities.forEach(({ city, itinerary }) => {
          plans[city] = itinerary;
          addMessage(`Added plan for: ${city.charAt(0).toUpperCase() + city.slice(1)}`, 'bot');
        });
      } else {
        addMessage("Invalid format. Use:\nAdd city: CityName\nDay 1: ...\nDay 2: ...", 'bot');
      }
    } else if (text.toLowerCase().startsWith('trip to ')) {
      const city = text.substring(8).trim();
      const { plan, city: foundCity } = getTravelPlan(city);
      addMessage(plan, 'bot', foundCity);
    } else {
      addMessage("Use 'Trip to CITY' or 'Add city:' format.", 'bot');
    }

    userInput.value = '';
    userInput.focus();
  });
