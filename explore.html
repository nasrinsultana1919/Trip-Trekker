<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Explore TripTrekker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #fc466b, #3f5efb);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .explore-container {
      text-align: center;
    }

    .explore-container h1 {
      font-size: 36px;
      margin-bottom: 30px;
    }

    .explore-options {
      display: flex;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .option-card {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px 40px;
      border-radius: 20px;
      text-decoration: none;
      color: white;
      font-size: 20px;
      font-weight: 600;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .option-card:hover {
      transform: scale(1.1);
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 20px rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>
  <div class="explore-container">
    <h1>Tell us where your next adventure begins</h1>
    <div class="explore-options">
      <a href="places.html" class="option-card">Places to Explore</a>
      <a href="map.html" class="option-card">Map</a>
    </div>
  </div>
</body>
</html>
